[project]
name = "hass-findmy"
version = "2026.11.3"
requires-python = ">=3.14.2,<3.15"
# Must match `requirements` in custom_components/findmy/manifest.json (checked in CI).
# anisette is a dependency of findmy, which allows any 1.x. It is pinned because the
# integration reads the bundles this package writes, see anisette_libs.py.
dependencies = ["findmy==0.10.2", "anisette==1.2.4"]

[dependency-groups]
dev = [
    # Requirements of the `usb` and `hassio` components, which `bluetooth` (our manifest
    # dependency) imports. Home Assistant installs them at runtime; tests need them up front.
    # Versions come from the constraints below or, for aiohasupervisor, hassio's manifest.
    "aiohasupervisor==0.6.0",
    "aiousbwatcher",
    "serialx",
    "basedpyright>=1.40.1",
    # Home Assistant provides itself at runtime; the pin is the version we test against and
    # must match the minimum version in hacs.json (checked in CI).
    "homeassistant==2026.9.3",
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "requires_bluetooth: needs homeassistant.components.bluetooth, which does not import on Windows",
]

[tool.pyright]
reportMissingTypeStubs = false

# Tests mirror the Ruff exceptions below: unannotated fixture parameters, mocks typed as Any,
# private helpers under test and fixtures requested only for their side effect.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
reportMissingParameterType = false
reportPrivateUsage = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnusedCallResult = false
reportUnusedParameter = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002", # annotations on `*args`
    "ANN003", # annotations on `**kwargs`

    "COM812", # missing trailing comma

    "CPY001", # missing copyright notice

    "S101", # assert

    "D", # Documentation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",     # fixtures and test functions do not need full annotations
    "ARG",     # fixtures are often requested only for their side effect
    "FBT",     # boolean positional values are common in mock setups
    "PLR0913", # tests may request many fixtures
    "PLR2004", # expected values are clearer inline than as named constants
    "S105",    # dummy credentials in test data
    "S106",    # dummy credentials in test data
    "SLF001",  # tests exercise private helpers on purpose
    "TC",      # type-only imports need not move into TYPE_CHECKING blocks
]
".github/**" = [
    "INP001", # standalone scripts, not a package
    "T201",   # scripts report through print
]

# Home Assistant pins exact versions of many libraries in package_constraints.txt, but not in
# its package metadata. Without these constraints uv may lock versions that Home Assistant
# rejects at runtime (e.g. mashumaro 3.16 on Python 3.14). Regenerate after bumping
# homeassistant with: uv run python .github/scripts/check_pins.py --write
