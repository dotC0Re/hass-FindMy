blueprint:
  name: FindMy tag - stale report warning
  description: >-
    Warns once when a FindMy tag has not reported its location for a given
    number of hours. Useful to catch dead batteries or firmware crashes early.
    The warning is sent again only after the tag has reported in between and
    then goes stale once more. If the tag is already stale when the automation
    (re)starts, no warning is sent until it has reported and gone stale again.
  domain: automation
  source_url: https://github.com/dotC0Re/hass-FindMy/blob/main/blueprints/automation/tag_stale.yaml
  homeassistant:
    # `triggers:` / `conditions:` / `actions:` and `trigger: <platform>` /
    # `action:` replaced the old keys in 2024.10.
    min_version: 2024.10.0
  input:
    tag_entity:
      name: FindMy tag
      description: The device_tracker to monitor
      selector:
        entity:
          filter:
            - integration: findmy
              domain: device_tracker
    stale_hours:
      name: Stale threshold
      description: Number of hours without a fresh report before warning
      default: 24
      selector:
        number:
          min: 1
          max: 168
          step: 1
          unit_of_measurement: h
          mode: box
    notify_service:
      name: Notification target
      description: >-
        Service name like `notify.mobile_app_myphone`. Leave empty for a
        persistent notification.
      default: ""
      selector:
        text: {}

# Only `trigger_variables` are available to trigger templates; plain
# `variables` are not.
trigger_variables:
  tag_entity_var: !input tag_entity
  stale_hours_var: !input stale_hours

variables:
  tag_entity_var: !input tag_entity
  stale_hours_var: !input stale_hours
  notify_service_var: !input notify_service

# A template trigger fires only on a change from false to true, so this
# warns once per stale period. Because the template uses now(), Home Assistant
# re-evaluates it every minute, so no polling interval is needed.
triggers:
  - trigger: template
    id: stale
    value_template: >-
      {% set detected = state_attr(tag_entity_var, 'detected_at') %}
      {% set detected_ts = as_timestamp(detected, none) if detected is not none else none %}
      {{ detected_ts is not none
         and as_timestamp(now()) - detected_ts > stale_hours_var * 3600 }}

actions:
  - variables:
      detected_ts: "{{ as_timestamp(state_attr(tag_entity_var, 'detected_at'), 0) }}"
      age_h: "{{ ((as_timestamp(now()) - detected_ts) / 3600) | round(1) }}"
      tag_name: "{{ state_attr(tag_entity_var, 'friendly_name') or tag_entity_var }}"
      message: >-
        {{ tag_name }} hasn't reported for {{ age_h }} h
        (threshold: {{ stale_hours_var }} h).
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_service_var | length > 0 }}"
        sequence:
          - action: "{{ notify_service_var }}"
            data:
              title: "FindMy: stale tag"
              message: "{{ message }}"
    default:
      - action: persistent_notification.create
        data:
          title: "FindMy: stale tag"
          message: "{{ message }}"
